name: Update Denmark OSM data

# Prepares denmark/osm/<region>.json (every named sight per region, from OpenStreetMap) so the Denmark planner
# downloads ready files instead of querying the public Overpass servers from a phone.
on:
  workflow_dispatch:
    inputs:
      regions:
        description: 'Region ids separated by spaces (empty = all)'
        required: false
        default: ''
      diagnose:
        description: 'Only time each query statement for these regions (no files written)'
        type: boolean
        default: false
  schedule:
    - cron: '47 4 * * *'   # daily at 04:47 UTC (quiet hours); only missing or >20-day-old regions are fetched

permissions:
  contents: write

concurrency:
  group: osm-denmark
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Diagnose (time each query statement)
        if: ${{ github.event.inputs.diagnose == 'true' }}
        env:
          REGIONS: ${{ github.event.inputs.regions }}
        run: set -f; node denmark/tools/osm-diagnose.mjs $REGIONS

      - name: Fetch regions from Overpass (each region is committed and pushed when done)
        if: ${{ github.event.inputs.diagnose != 'true' }}
        env:
          OSM_COMMIT: '1'
          REGIONS: ${{ github.event.inputs.regions }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set -f; node denmark/tools/osm-update.mjs $REGIONS
