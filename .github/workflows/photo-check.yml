name: Check place photos

# Loads every custom place photo in portugal/data.json and reports which ones fail (status, type, hotlink blocking).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node portugal/tools/photo-check.mjs
