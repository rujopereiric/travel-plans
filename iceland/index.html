<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iceland Planner — moved</title>
<meta http-equiv="refresh" content="0; url=../iceland-planner/">
<style>body{margin:0;background:#14202b;color:#e6edf2;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:40px 16px;text-align:center}a{color:#4fb3c6}</style>
</head>
<body>
<p>The Iceland planner has moved to <a href="../iceland-planner/">travel-plans/iceland-planner/</a>.</p>
<p>Your saved plan comes with it.</p>
<script>
// clear the old offline cache for this address, then go to the new one
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if (r.scope.endsWith('/iceland/')) r.unregister(); }));
location.replace('../iceland-planner/' + location.hash);
</script>
</body>
</html>
